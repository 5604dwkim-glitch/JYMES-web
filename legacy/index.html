<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>(주)조영산업 생산 시스템</title>
  
  <!-- Modern Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Chart.js for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- System Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=1786762500000">
  <style>.sec-num::after { content: none !important; }</style>
</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation Area -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <h1 data-i18n="system_title">(주)조영산업 생산 시스템</h1>
          <span data-i18n="system_subtitle">자동차 부품 생산 및 불량 통합 관리</span>
        </div>
      </div>

      <div style="padding: 10px 16px; border-bottom: 1px solid #1e293b; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="user-role-badge" id="currentRoleBadge" data-i18n="unauthenticated">👤 미인증</span>
          <span class="live-clock" id="liveClockDisplay">00:00:00</span>
        </div>
        <button class="btn btn-secondary btn-sm" id="btnSwitchRoleHeader" style="width: 100%; font-size: 11px; padding: 4px 8px; margin-top: 2px;" data-i18n="role_switch">
          🔄 접속 모드 변경
        </button>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-tab="dashboard">
          <span>📊</span>
          <span data-i18n="nav_dashboard">메인 대시보드</span>
        </a>
        <a class="nav-item" data-tab="form">
          <span>✍️</span>
          <span data-i18n="nav_form">작업일보 신규작성</span>
        </a>
        <a class="nav-item" data-tab="drafts">
          <span>📝</span>
          <span data-i18n="nav_drafts">작성중인 작업일보</span>
        </a>
        <a class="nav-item" data-tab="reports">
          <span>📋</span>
          <span data-i18n="nav_reports">작업일보 조회 및 승인</span>
        </a>
        <a class="nav-item" data-tab="analytics">
          <span>📈</span>
          <span data-i18n="nav_analytics">공정 및 불량 분석</span>
        </a>
        <a class="nav-item" data-tab="master">
          <span>👥</span>
          <span data-i18n="nav_master">작업자 관리</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="company-badge">
          <div class="badge-info">
            <span class="badge-name" data-i18n="company_name">(주)조영산업</span>
            <span class="badge-sub" data-i18n="dept_name">생산관리본부 | V9.0</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <header class="top-header">
        <div>
          <span class="page-title" id="pageTitle" data-i18n="title_dashboard">메인 대시보드</span>
          <span class="page-subtitle" id="pageSubtitle" data-i18n="subtitle_dashboard">현장 모바일 작업 실시간 모니터링</span>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <!-- Header Language Selector -->
          <div class="lang-select-container">
            <select id="headerLangSelect" class="lang-select">
              <option value="ko">🇰🇷 한국어</option>
              <option value="en">🇺🇸 English</option>
              <option value="th">🇹🇭 ภาษาไทย</option>
              <option value="tl">🇵🇭 Tagalog</option>
              <option value="vi">🇻🇳 Tiếng Việt</option>
            </select>
          </div>
          <button class="btn btn-primary btn-sm" id="btnQuickReport">
            <span>➕</span> <span data-i18n="quick_report">일보 작성</span>
          </button>
        </div>
      </header>

      <main class="content-body" id="contentBody">
        <div class="tab-view active" id="view-dashboard"></div>
        <div class="tab-view" id="view-form"></div>
        <div class="tab-view" id="view-drafts"></div>
        <div class="tab-view" id="view-reports"></div>
        <div class="tab-view" id="view-analytics"></div>
        <div class="tab-view" id="view-master"></div>
      </main>
    </div>
  </div>

  <!-- 시스템 접속 / 권한 선택 모달 -->
  <div class="modal-backdrop" id="roleModalBackdrop">
    <div class="modal-content" style="max-width: 440px;">
      <div style="margin-bottom: 16px; border-bottom: 2px solid var(--border-color); padding-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <h3 class="modal-title" style="margin: 0; font-size: 17px; font-weight: 800;" data-i18n="modal_title">
            (주)조영산업 생산 시스템 접속
          </h3>
          <!-- Modal Language Selector -->
          <select id="modalLangSelect" class="lang-select lang-select-sm">
            <option value="ko">🇰🇷 한국어</option>
            <option value="en">🇺🇸 English</option>
            <option value="th">🇹🇭 ภาษาไทย</option>
            <option value="tl">🇵🇭 Tagalog</option>
            <option value="vi">🇻🇳 Tiếng Việt</option>
          </select>
        </div>
        <p style="font-size: 12px; color: var(--text-muted); margin: 0;" data-i18n="modal_subtitle">접속하실 작업 모드를 선택해 주세요.</p>
      </div>

      <!-- 모드 선택 카드리스트 (기본: 작업자 입력 모드 선택) -->
      <div class="role-selection-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 14px;">
        <div class="role-card" id="cardSelectWorker" style="padding: 12px; text-align: center; border: 2px solid var(--accent-cyan); background: #f0f9ff;">
          <div class="role-card-icon" style="background: rgba(2, 132, 199, 0.15); color: var(--accent-cyan); width: 38px; height: 38px; margin: 0 auto 6px auto; font-size: 20px;">
            👷
          </div>
          <h4 style="font-size: 13px; font-weight: 700; margin-bottom: 2px;" data-i18n="mode_worker">작업자 입력 모드</h4>
          <span style="font-size: 10px; color: var(--text-muted);" data-i18n="mode_worker_desc">현장 작업자 본인 인증</span>
        </div>

        <div class="role-card" id="cardSelectAdmin" style="padding: 12px; text-align: center; border: 2px solid var(--border-color);">
          <div class="role-card-icon" style="background: rgba(124, 58, 237, 0.1); color: var(--accent-purple); width: 38px; height: 38px; margin: 0 auto 6px auto; font-size: 20px;">
            👨‍💼
          </div>
          <h4 style="font-size: 13px; font-weight: 700; margin-bottom: 2px;" data-i18n="mode_admin">관리자 / 생산총괄</h4>
          <span style="font-size: 10px; color: var(--text-muted);" data-i18n="mode_admin_desc">통계, 승인 및 관리자</span>
        </div>
      </div>

      <!-- 비밀번호 인증 입력 폼 (기본 표출) -->
      <div id="authFormArea" style="display: block; background: #f8fafc; padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
        <div id="workerAuthFields" style="display: block; margin-bottom: 12px;">
          <div style="margin-bottom: 10px;">
            <label style="font-size: 12px; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 4px;" data-i18n="label_worker_name">작업자 성함</label>
            <input type="text" id="authWorkerName" class="form-control" placeholder="성함 입력 (예: 장수미, 김민준)" data-i18n-placeholder="placeholder_worker_name" value="" />
          </div>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="font-size: 12px; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 4px;" id="authPasswordLabel" data-i18n="label_password">비밀번호</label>
          <input type="password" id="authPassword" class="form-control" placeholder="비밀번호 입력" data-i18n-placeholder="placeholder_password" value="" />
        </div>

        <button class="btn btn-primary" id="btnSubmitAuth" style="width: 100%; padding: 10px; font-size: 14px;" data-i18n="btn_login">
          🔑 시스템 접속하기
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Message Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- App Main Scripts -->
  <script type="module" src="js/app.js?v=1786762500000"></script>
</body>
</html>
